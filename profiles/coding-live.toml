[profile]
name = "coding-live"

[model]
provider = "anthropic-compatible"
model = "deepseek-flash[1M]"
base_url = "https://api.deepseek.com/anthropic"
api_key_env = "ANTHROPIC_AUTH_TOKEN"
thinking_budget = 0
max_output_tokens = 4096
context_window = 131072

[context]
stages = ["system", "memory", "history", "latest"]
budget_tokens = 16000

[tools]
visible = ["echo", "read_file", "write_file", "list_trash", "restore_file", "list_dir", "code_search", "make_dir", "move_file", "delete_file", "shell", "todo"]
budget = 1000

[verification]
mode = "none"

[permission]
level = "workspace_auto"

[persona]
system = "prompts/coding.md"
