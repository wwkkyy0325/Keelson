# The coding rig against the live endpoint. Shared settings are in
# `live-base.toml`; this file holds what differs.

[profile]
name = "coding-live"
extends = "live-base.toml"

[model]
# An edit is the most probable continuation of the file, not a variation on
# it. Kept low so the same task twice produces the same diff.
temperature = 0.2

[tools]
visible = ["read_file", "write_file", "edit_file", "multi_edit", "apply_edits", "list_trash", "restore_file", "list_dir", "glob", "code_search", "git_diff", "move_file", "delete_file", "shell", "todo", "search_history", "web_search", "web_fetch", "list_windows", "screen_capture", "view_image", "launch_app", "wait_for_window", "list_controls"]

[verification]
mode = "none"
# A release link with LTO and a single slow test both run for minutes without
# printing a line. The window is inactivity, not a deadline, so this only
# bounds how long a silent command is given.
command_timeout_ms = 300000

[persona]
system = "prompts/coding.md"
