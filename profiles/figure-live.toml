# The figure rig against the live endpoint. Shared settings are in
# `live-base.toml`; this file holds what differs.

[profile]
name = "figure-live"
extends = "live-base.toml"

[model]
# Every assembly is a drawing decision; the same brief should not produce the
# same figure twice. High on purpose.
temperature = 0.9

[tools]
visible = ["read_file", "write_file", "edit_file", "multi_edit", "list_trash", "restore_file", "list_dir", "glob", "code_search", "move_file", "delete_file", "shell", "todo", "search_history", "web_search", "web_fetch", "view_image", "render_scene", "render_film", "probe_media", "new_episode", "archive_episode"]

[verification]
mode = "none"
# `render_film` hands frames to ffmpeg, which can encode for minutes without a
# progress line. The window is inactivity, so it only bounds silence.
command_timeout_ms = 300000

[persona]
system = "prompts/figure.md"
