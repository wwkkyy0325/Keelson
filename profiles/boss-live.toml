[profile]
name = "boss-live"

[model]
provider = "anthropic-compatible"
model = "deepseek-flash"
base_url = "https://api.deepseek.com/anthropic"
api_key_env = "ANTHROPIC_AUTH_TOKEN"
thinking_budget = 0
# The opener has to sound like a person reading that one post, not a template.
temperature = 0.7
max_output_tokens = 32768
context_window = 1048576

[context]
stages = ["system", "memory", "history", "latest"]
budget_tokens = 48000
max_budget_tokens = 131072

[tools]
visible = ["read_file", "write_file", "edit_file", "multi_edit", "list_dir", "glob", "code_search", "shell", "todo", "search_history", "web_search", "web_fetch", "view_image", "list_windows", "screen_capture", "launch_app", "wait_for_window", "list_controls"]
budget = 800

[verification]
mode = "none"

[permission]
level = "full_auto"

[persona]
system = "prompts/boss.md"
