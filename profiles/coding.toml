[profile]
name = "coding"

[model]
provider = "mock"
model = "mock-coding"
thinking_budget = 1024
max_output_tokens = 8192

[context]
stages = ["system", "memory", "history", "latest"]
budget_tokens = 64000

[tools]
visible = ["read_file", "write_file", "edit_file", "multi_edit", "list_trash", "restore_file", "list_dir", "glob", "code_search", "make_dir", "move_file", "delete_file", "shell", "todo"]
budget = 1000

[verification]
mode = "none"

[permission]
level = "workspace_auto"

[persona]
system = "prompts/coding.md"
