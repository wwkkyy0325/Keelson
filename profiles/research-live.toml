# The research rig against the live endpoint. Shared settings are in
# `live-base.toml`; this file holds what differs.

[profile]
name = "research-live"
extends = "live-base.toml"

[model]
# A quote has to be the quote and a date has to be the date. Low, like an edit.
temperature = 0.2

[tools]
visible = ["read_file", "write_file", "edit_file", "list_dir", "glob", "code_search", "shell", "todo", "search_history", "web_search", "web_fetch", "list_windows", "screen_capture", "view_image", "launch_app", "wait_for_window", "list_controls"]

[verification]
mode = "none"

[persona]
system = "prompts/research.md"
