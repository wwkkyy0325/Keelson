# The office rig against the live endpoint. Shared settings are in
# `live-base.toml`; this file holds what differs.

[profile]
name = "office-live"
extends = "live-base.toml"

[model]
# Prose: consistent enough to keep one voice across a document, free enough to
# not write the same paragraph twice.
temperature = 0.7

[tools]
visible = ["read_file", "write_file", "edit_file", "multi_edit", "list_trash", "restore_file", "list_dir", "glob", "code_search", "move_file", "delete_file", "shell", "todo", "search_history", "web_search", "web_fetch", "list_windows", "screen_capture", "view_image", "launch_app", "wait_for_window", "list_controls"]

[verification]
mode = "none"

[persona]
system = "prompts/office.md"
