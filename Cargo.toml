[package]
name = "keelson"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/wwkkyy0325/Keelson"
publish = false

[[bin]]
name = "keelson"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }
keel-core = { path = "../Keel/crates/keel-core" }
keel-model-anthropic = { path = "../Keel/crates/keel-model-anthropic" }
keel-model-openai = { path = "../Keel/crates/keel-model-openai" }
keel-policy = { path = "../Keel/crates/keel-policy" }
keel-runtime = { path = "../Keel/crates/keel-runtime" }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "brotli",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
xcap = "0.9"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
keel-testkit = { path = "../Keel/crates/keel-testkit" }
tempfile = "3"
