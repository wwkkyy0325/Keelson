[package]
name = "keelson"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[[bin]]
name = "keelson"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
crossterm = "0.28"
dotenvy = "0.15"
keel-core = { path = "../Keel/crates/keel-core" }
keel-model-anthropic = { path = "../Keel/crates/keel-model-anthropic" }
keel-model-openai = { path = "../Keel/crates/keel-model-openai" }
keel-policy = { path = "../Keel/crates/keel-policy" }
keel-runtime = { path = "../Keel/crates/keel-runtime" }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
keel-testkit = { path = "../Keel/crates/keel-testkit" }
tempfile = "3"
