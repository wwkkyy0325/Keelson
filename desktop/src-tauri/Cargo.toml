[package]
name = "keelson-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
keel-core = { path = "../../../Keel/crates/keel-core" }
keelson = { path = "../.." }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "zstd"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

# Build-environment override: the sandbox caps CPU time per process at 35s
# (RLIMIT_CPU) and this crate's final codegen at opt-level=3 exceeds it, so
# rustc dies with SIGXCPU. Lower optimization for THIS package only; every
# dependency keeps the regular release profile.
[profile.release.package."keelson-desktop"]
opt-level = 0
codegen-units = 16
